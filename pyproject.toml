[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "folder-ledger"
version = "0.1.0"
description = "Read-only folder inventories and duplicate-content reports"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
folder-ledger = "folder_ledger.__main__:main"

[tool.setuptools.packages.find]
include = ["folder_ledger*"]
